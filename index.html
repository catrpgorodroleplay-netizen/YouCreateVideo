<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATE - Ваш видео хостинг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>CREATE</h1>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск видео...">
                <button onclick="searchVideos()">🔍</button>
            </div>
            <div class="user-actions">
                <button id="uploadBtn" onclick="showUploadForm()">📹 Загрузить</button>
                <button id="authBtn" onclick="toggleAuth()">👤 Войти</button>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#" class="active" onclick="showSection('home')">🏠 Главная</a></li>
                    <li><a href="#" onclick="showSection('trending')">🔥 Популярное</a></li>
                    <li><a href="#" onclick="showSection('subscriptions')">📋 Подписки</a></li>
                    <li><a href="#" onclick="showSection('library')">📚 Библиотека</a></li>
                    <li><a href="#" onclick="showSection('history')">⏱️ История</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <!-- Домашняя страница -->
            <section id="home" class="content-section active">
                <h2>Рекомендуемые видео</h2>
                <div class="video-grid" id="videoGrid"></div>
            </section>

            <!-- Популярное -->
            <section id="trending" class="content-section">
                <h2>Популярные видео</h2>
                <div class="video-grid" id="trendingGrid"></div>
            </section>

            <!-- Подписки -->
            <section id="subscriptions" class="content-section">
                <h2>Подписки</h2>
                <div class="video-grid" id="subscriptionsGrid"></div>
            </section>

            <!-- Библиотека -->
            <section id="library" class="content-section">
                <h2>Ваша библиотека</h2>
                <div class="video-grid" id="libraryGrid"></div>
            </section>

            <!-- История -->
            <section id="history" class="content-section">
                <h2>История просмотров</h2>
                <div class="video-grid" id="historyGrid"></div>
            </section>

            <!-- Страница видео -->
            <section id="videoPage" class="content-section">
                <div class="video-player-container">
                    <video id="mainVideoPlayer" controls></video>
                    <div class="video-info">
                        <h2 id="videoTitle"></h2>
                        <div class="video-stats">
                            <span id="videoViews"></span>
                            <span>•</span>
                            <span id="videoDate"></span>
                            <div class="video-actions">
                                <button onclick="likeVideo()" id="likeBtn">👍 <span id="likeCount">0</span></button>
                                <button onclick="dislikeVideo()" id="dislikeBtn">👎 <span id="dislikeCount">0</span></button>
                                <button onclick="shareVideo()">📤 Поделиться</button>
                                <button onclick="subscribeToChannel()" id="subscribeBtn">📋 Подписаться</button>
                            </div>
                        </div>
                        <div class="channel-info">
                            <img id="channelAvatar" src="" alt="Аватар канала">
                            <div>
                                <h4 id="channelName"></h4>
                                <p id="subscribersCount"></p>
                            </div>
                        </div>
                        <div class="video-description">
                            <p id="videoDescription"></p>
                        </div>
                    </div>
                </div>
                <div class="comments-section">
                    <h3>Комментарии</h3>
                    <div class="add-comment">
                        <textarea id="commentText" placeholder="Добавьте комментарий..."></textarea>
                        <button onclick="addComment()">Комментировать</button>
                    </div>
                    <div id="commentsList" class="comments-list"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Модальные окна -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('authModal')">&times;</span>
            <h2>Вход / Регистрация</h2>
            <form id="authForm">
                <input type="text" id="username" placeholder="Имя пользователя" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" id="authSubmitBtn">Войти</button>
            </form>
            <p id="authToggleText">Нет аккаунта? <a href="#" onclick="toggleAuthMode()">Зарегистрироваться</a></p>
        </div>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('uploadModal')">&times;</span>
            <h2>Загрузить видео</h2>
            <form id="uploadForm">
                <input type="text" id="videoTitleInput" placeholder="Название видео" required>
                <textarea id="videoDescriptionInput" placeholder="Описание видео"></textarea>
                <input type="file" id="videoFile" accept="video/*" required>
                <input type="file" id="thumbnailFile" accept="image/*" required>
                <button type="submit">Загрузить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
  </html>
